
name: Update Total GitHub Stars

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stars:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate total stars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repos = [
              "thanhtbt/tensor_tracking_survey",
              "thanhle88/streaming-tensor-decompositions"
          ]

          total = 0
          for repo in repos:
              url = f"https://api.github.com/repos/{repo}"
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "User-Agent": "github-stars-badge"
                  }
              )
              with urllib.request.urlopen(request) as response:
                  data = json.load(response)
              total += data["stargazers_count"]

          badge = {
              "schemaVersion": 1,
              "label": "stars",
              "message": str(total),
              "color": "brightgreen"
          }

          with open("stars.json", "w") as f:
              json.dump(badge, f, indent=2)
          PY

      - name: Commit updated stars
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stars.json
          if ! git diff --cached --quiet; then
            git commit -m "Update total GitHub stars"
            git push
          fi
